name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and Python syntax
        run: |
          for script in scripts/*.sh packaging/debian/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts vendor
  nix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L --cores 2 --max-jobs 1
